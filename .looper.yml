tools:
  nodejs: 16.18.0
  npm: 8.19.2

envs:
  global:
    variables:
      REPO_NAME: ALL #default value for all apps
      APP_NAME: BLANK
      UFM_REPOS:  #add app names here
        - ibg-ufm-metadata-service
        - ibg-ufm-core-service
        - ibg-ufm-domino-service
        - ibg-ufm-allocation-engine
        - ibg-ufm2-ui
        - ibg-ufm-canned-reports
      ALL:
        - ibg-shared-ui
        - ibg-visualizer-ui

        
triggers:
  - push: disabled
  - manual:
      name: Run API Regression
      call: runUFMBeTests
  - manual:
      name: Run UFM UI Regression
      call: runUFMFeTests
  - manual:
      name: Run Adhoc Test
      call: runCustomTest
      parameters:
        - testTag: { type: string }
        - playwrightProject: { type: string }
        - APP_NAME: { type: choice , label: "App Name for run" }
        
parameters:
  - app: { type: string }
  - envr: { type: string }
  - testrunid: { type: string }

flows:
  default:
    - echo "IBG Test Suite!"
    - call: runAllTests
  concord-triggered-flow:
    - echo "Calling e2e flow from concord"
    - if: $app
      then:
      - echo "App found from Concord"
      - var(REPO_NAME = '$app')
    - echo "Running for App -> ${REPO_NAME}"
    - if: | #search all app name here
       %{app =~ ALL}
      then:
      - var(APP_NAME = 'IBG')
      - call: runAllTests
    - if: | #search ufm app name here
       %{app =~ UFM_REPOS}
      then:
      - var(APP_NAME = 'UFM')
      - call: runUFMSMokeTest
    - if: | 
       %{APP_NAME == 'BLANK'}
      then:
      - echo "No matching app name was found. Exiting!!"
  runAllTests:
    try:
      - echo "Running all the tests in the repo"
      - call: setup
      - RUN_ID=$testrunid ENV=$envr TEST=regression npm run tests:ufm-tests 
    finally:
      - call: reporter
  runUFMBeTests:
    try:
      - echo "Running UFM API testcases "
      - call: setup
      - RUN_ID=$testrunid ENV=$envr TEST=regression npm run tests:ufm-tests-be
    finally:
      - call: reporter
  runUFMFeTests:
    try:
      - echo "Running UFM UI testcases "
      - call: setup
      - RUN_ID=$testrunid ENV=$envr TEST=regression npm run tests:ufm-tests-fe
    finally:
      - call: reporter
  runUFMSMokeTest:
    try:
      - echo "Running UFM Smoke testcases "
      - call: setup
      - RUN_ID=$testrunid ENV=$envr TEST=smoke npm run tests:ufm-tests 
    finally:
      - call: reporter
  runCustomTest:
    try:
      - echo "Running Custom TestCase Manual Trigger "
      - call: setup
      - tag=$testTag PROJECT=$playwrightProject ENV=$envr npm run tests:looper-tests
    finally:
      - call: reporter      

  setup:
      - npm install
      - npx playwright install chromium
      - echo '{}' > secrets/nexus-users-token.json
      - echo '{}' > secrets/ibg-users-token.json
  reporter:
    - publishReport:
        context: playwright
        dir: playwright-report
        index: index.html
        verbose: true

