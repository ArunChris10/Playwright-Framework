tools:
  sonarscanner: "4.8.0.2856"
  nodejs: 16.18.0
  npm: 8.19.2

useSecretStore: true
envs:
  global:
    variables:
      CRED_SECRET: "%{credentials.secret('ufm_secrets')}"
      REPO_NAME: ALL #default value for all apps
      APP_NAME: $app
      SLACK_CHANNEL: "ibg-ufm-automation-report"
      ERROR_SLACK_CHANNEL: "ibg-ufm-automation-report"
      TEST_RESULT: false

      UFM_REPOS: #add app names here
        - ibg-ufm-metadata-service
        - ibg-ufm-core-service
        - ibg-ufm-domino-service
        - ibg-ufm-allocation-engine
        - ibg-ufm2-ui
        - ibg-ufm-canned-reports
        - ibg-ufm-canned-reports-backend
        - ibg-shared-ui
        - ibg-shared-pages
      CDF_REPOS:
        - ibg-service-visualizer
        - ibg-centrifuge-ui
        - ibg-visualizer-ui
        - ibg-service-scenario-financials

triggers:
  # - push:
  #     name: Run ConcordTriggeredFlow
  #     call: push-flow
  - manual:
      name: Run UFM API Regression
      call: runUFMBeTests
  - manual:
      name: Run UFM API Regression_newFramework
      call: runUFMBeTests_apiFramework
  - manual:
      name: Run UFM API Smoke
      call: runUFMBeSmokeTests
  - manual:
      name: Run UFM UI Regression
      call: runUFMUITests
  - manual:
      name: Run UFM UI Smoke
      call: runUFMUISmokeTest
  - manual:
      name: Run CDF Test
      call: runCDFSMokeTest
  - manual:
      name: Run CDF Custom Test
      call: runCDFCustomTest
  - manual:
      name: Run Adhoc Test
      call: runCustomTest
      parameters:
        - playwrightProject:
            {
              type: string,
              label: "Provide the project name that matches with the one in the playwright config file- EX-(ufm-be,ufm-fe,cdf-be,cdf-fe)",
            }
        - testTag:
            {
              type: string,
              label: "Provide the unique tag to run the test along with @",
            }
  - manual:
      name: Run ConcordTriggeredFlow
      call: concord-triggered-flow
  - manual:
      name: Run Concord_Integration Test
      call: concord-triggered-flow-integration
parameters:
  - app:
      {
        type: string,
        label: "Provide the app name which the test belong to - EX - (UFM, CDF)",
      }
  - envr:
      {
        type: string,
        label: "Provide the env name in which the test needs to run - EX - (qa,dev,stg)",
      }
  - testrunid: { type: string }

flows:
  run-sonar-pr:
    - sonar("Sonar"):
        - (name Sonar) sonar-scanner -X -Dproject.settings=sonar-project.properties
          -Dsonar.pullrequest.github.repository=IBG/ibg-testscripts-playwright
          -Dsonar.host.url="https://sonar.looper.prod.walmartlabs.com"
          -Dsonar.pullrequest.key=${GITHUB_PR_NUMBER}
          -Dsonar.pullrequest.branch=${GITHUB_PR_SOURCE_BRANCH}
          -Dsonar.pullrequest.base=${GITHUB_PR_TARGET_BRANCH}
          -Dsonar.scm.revision=${GITHUB_PR_HEAD_SHA}

  sonar-fetch-remote-fix-ref:
    shell: |
      #!/bin/bash
      git fetch --no-tags --all --verbose
      if [[ ! -z "${GITHUB_PR_TARGET_BRANCH}" ]]
      then
        git fetch --no-tags origin ${GITHUB_PR_TARGET_BRANCH}:refs/remotes/origin/${GITHUB_PR_TARGET_BRANCH}
        git checkout -b remotes/origin/pr/${GITHUB_PR_NUMBER}
        git branch -D ${GITHUB_PR_TARGET_BRANCH}
      fi

  default:
    - echo "IBG Test Suite!"
    - call: runAllTests
  # push-flow:
  #   - var(app = 'ibg-shared-ui')
  #   - var(envr = 'qa')
  #   - call: concord-triggered-flow
  concord-triggered-flow:
    - echo "Calling e2e flow from concord"
    - if: $app
      then:
        - echo "App found from Concord"
        - var(REPO_NAME = '$app')
    - echo "Running for App -> ${REPO_NAME}"
    - if: | #search ufm app name here
        %{app =~ UFM_REPOS}
      then:
        - var(APP_NAME = 'UFM')
        - call: runUFMBeTests
    - if: | #search ufm app name here
        %{app =~ CDF_REPOS}
      then:
        - var(APP_NAME = 'CDF')
        - call: runCDFRegressionTest
    - if: |
        %{APP_NAME == 'BLANK'}
      then:
        - echo "No matching app name was found. Exiting!!"
  concord-triggered-flow-integration:
    - echo "Calling integration flow from concord"
    - if: $app
      then:
        - echo "App found from Concord"
        - var(REPO_NAME = '$app')
    - echo "Running for App -> ${REPO_NAME}"
    - if: | #search ufm app name here
        %{app =~ UFM_REPOS}
      then:
        - var(APP_NAME = 'UFM')
        - call: runUFMBeTests_apiFramework
    - if: | #search ufm app name here
        %{app =~ CDF_REPOS}
      then:
        - var(APP_NAME = 'CDF')
        - call: runCDFRegressionTest
    - if: |
        %{APP_NAME == 'BLANK'}
      then:
        - echo "No matching app name was found. Exiting!!"
  runAllTests:
    try:
      - echo "Running all the tests in the repo"
      - call: setup
      - APP_NAME=$app RUNID=$testrunid ENV=$envr TEST=regression npm run tests:ufm-tests
      - var(TEST_RESULT =true)
    finally:
      - call: reporter
      - call: send_slack_msg
  runUFMBeTests:
    try:
      - echo "Running UFM API Regression testcases "
      - call: setup
      - RUNID=$testrunid ENV=$envr TEST=regression npm run tests:ufm-tests-be
      - var(TEST_RESULT =true)
    finally:
      - call: reporter
      - call: send_slack_msg
  runUFMBeTests_apiFramework:
    try:
      - echo "Running UFM API Regression testcases using new framework"
      - call: setup
      - RUNID=$testrunid ENV=$envr TEST=apiFramework npm run tests:apiutility
      - var(TEST_RESULT =true)
    finally:
      - call: reporter
      - call: send_slack_msg
  runUFMBeSmokeTests:
    try:
      - echo "Running UFM API Smoke testcases "
      - call: setup
      - RUNID=$testrunid ENV=$envr TEST=smoke npm run tests:ufm-tests-be
      - var(TEST_RESULT =true)
    finally:
      - call: reporter
      - call: send_slack_msg
  runUFMUITests:
    try:
      - echo "Running UFM UI Regression testcases "
      - call: setup
      - RUNID=$testrunid ENV=$envr TEST=regression npm run tests:ufm-tests-fe
      - var(TEST_RESULT =true)
    finally:
      - call: reporter
      - call: send_slack_msg
  runUFMUISmokeTest:
    try:
      - echo "Running UFM UI Smoke testcases "
      - call: setup
      - RUNID=$testrunid ENV=$envr TEST=smoke npm run tests:ufm-tests-fe
      - var(TEST_RESULT =true)
    finally:
      - call: reporter
      - call: send_slack_msg
  runUFMSMokeTest:
    try:
      - echo "Running UFM Smoke testcases "
      - call: setup
      - RUNID=$testrunid ENV=$envr TEST=smoke npm run tests:ufm-tests
      - var(TEST_RESULT =true)
    finally:
      - call: reporter
      - call: send_slack_msg

  runCDFCustomTest:
    try:
      - echo "Running CDF Smoke testcases "
      - call: setup
      - APP_NAME=CDF RUNID=$testrunid ENV=$envr TEST=custom_tag npm run tests:cdf-tests
      - var(TEST_RESULT =true)
    finally:
      - call: reporter
      - call: send_slack_msg

  runCDFSMokeTest:
    try:
      - echo "Running CDF Smoke testcases "
      - call: setup
      - RUNID=$testrunid ENV=$envr TEST=smoke npm run tests:cdf-tests
      - var(TEST_RESULT =true)
    finally:
      - call: reporter
      - call: send_slack_msg

  runCDFRegressionTest:
    try:
      - echo "Running CDF Smoke testcases "
      - call: setup
      - RUNID=$testrunid ENV=$envr TEST=regression npm run tests:cdf-tests
      - var(TEST_RESULT =true)
    finally:
      - call: reporter
      - call: send_slack_msg

  runCustomTest:
    try:
      - echo "Running Custom TestCase Manual Trigger "
      - call: setup
      - APP_NAME=$app tag=$testTag PROJECT=$playwrightProject ENV=$envr npm run tests:looper-tests
      - var(TEST_RESULT =true)
    finally:
      - call: reporter
      - call: send_slack_msg

  setup:
    - npm install
    - npx playwright install chromium
    - echo '{}' > secrets/nexus-users-token.json
    - echo '{}' > secrets/ibg-users-token.json
    - echo '{}' > secrets/ibg-user-storagestate.json
    - echo '{}' > secrets/nexus-user-storagestate.json
  reporter:
    - publishReport:
        context: playwright/${APP_NAME}
        dir: playwright-report/${APP_NAME}
        index: index.html
        verbose: true

  send_slack_msg:
    - echo "$TEST_RESULT"
    - switch($TEST_RESULT):
        case(true):
          - echo "Success For True Message"
          - slack.postMessage:
              username: "${JOB_NAME}"
              message: "Automation Build successful on ENV `${envr}` for ${app} service on branch `${GITHUB_BRANCH_NAME}` "
              channelId: "${SLACK_CHANNEL}"
              iconEmoji: ":circleci-pass:"
              attachments:
                - fallback: "${BUILD_URL}"
                  color: "#0bff01"
                  actions:
                    - type: "button"
                      text: "View Report for Build #${BUILD_NUMBER} "
                      url: https://cdc-obj-200.storage.cloud.wal-mart.com/swift/v1/looperpro-generic-prod/reports/${JOB_NAME}/${BUILD_NUMBER}/playwright${APP_NAME}/index.html
                      style: "primary"
        otherwise:
          - echo "Failure For False Message"
          - slack.postMessage:
              username: "${JOB_NAME}"
              message: "Automation Build failed on ENV `${envr}` for ${app} service on branch `${GITHUB_BRANCH_NAME}` "
              channelId: "${SLACK_CHANNEL}"
              iconEmoji: ":circleci-fail:"
              attachments:
                - fallback: "${BUILD_URL}"
                  color: "#fe0000"
                  actions:
                    - type: "button"
                      text: "View Report for Build #${BUILD_NUMBER} "
                      url: https://cdc-obj-200.storage.cloud.wal-mart.com/swift/v1/looperpro-generic-prod/reports/${JOB_NAME}/${BUILD_NUMBER}/playwright${APP_NAME}/index.html
                      style: "danger"
